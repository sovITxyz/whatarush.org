<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - What A Rush</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #fffbeb 0%, #fed7aa 50%, #fffbeb 100%);
        color: #1f2937;
      }
      .container {
        text-align: center;
        padding: 2rem;
        max-width: 500px;
      }
      h1 {
        font-size: 6rem;
        font-weight: 800;
        background: linear-gradient(to right, #d97706, #ea580c);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1;
        margin-bottom: 1rem;
      }
      h2 {
        font-size: 1.5rem;
        color: #374151;
        margin-bottom: 1rem;
      }
      p {
        color: #6b7280;
        margin-bottom: 2rem;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 0.75rem 2rem;
        background: linear-gradient(to right, #14b8a6, #06b6d4);
        color: white;
        text-decoration: none;
        border-radius: 9999px;
        font-weight: 600;
        transition: transform 0.2s, box-shadow 0.2s;
      }
      a:hover {
        transform: scale(1.05);
        box-shadow: 0 10px 25px rgba(20, 184, 166, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>The page you're looking for doesn't exist. Let's get you back to the horses!</p>
      <a href="/">Back to What A Rush</a>
    </div>
  </body>
</html>
